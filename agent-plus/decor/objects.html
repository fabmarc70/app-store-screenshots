<!doctype html>
<html>
<!-- Objets 3D décoratifs Agent+ (three.js). URL: /decor/objects.html?o=<nom>&size=900 -->
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {TextGeometry} from 'three/addons/geometries/TextGeometry.js';
import {TTFLoader} from 'three/addons/loaders/TTFLoader.js';
import {Font} from 'three/addons/loaders/FontLoader.js';

const q = new URLSearchParams(location.search);
const name = q.get('o') || 'coin', S = +q.get('size') || 900;

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(S, S); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// Éclairage studio : environnement doux + lumière principale + contre-jour bleuté
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x9cc8ff, 1.6); rim.position.set(5, 2, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a4cb0, 0.6));
const cam = new THREE.PerspectiveCamera(26, 1, 0.1, 100);

// Matières
const clay = (c, o = {}) => new THREE.MeshPhysicalMaterial({color: c, roughness: o.r ?? 0.35, metalness: 0,
  clearcoat: o.cc ?? 0.7, clearcoatRoughness: 0.18, ...(o.extra || {})});
// Métal « jouet » : semi-métallique + vernis, pour rester lumineux sur fond bleu
const metal = (c, r = 0.28) => new THREE.MeshPhysicalMaterial({color: c, metalness: .45, roughness: r, clearcoat: 1, clearcoatRoughness: .12});
const C = {blue: 0x2F6BFF, blueD: 0x1747D0, orange: 0xFF6A1F, gold: 0xFFC23A, white: 0xF4F7FF,
  green: 0x1FBF84, ink: 0x0B1533, silver: 0xEEF1F7, line: 0xB9C7E8};

const font = await new Promise(res => new TTFLoader().load('fonts/Inter-ExtraBold.otf', j => res(new Font(j))));
const text = (str, size, depth, mat) => {
  const g = new TextGeometry(str, {font, size, height: depth, curveSegments: 12, bevelEnabled: true,
    bevelThickness: depth * 0.35, bevelSize: size * 0.025, bevelSegments: 6});
  g.center(); return new THREE.Mesh(g, mat);
};
const rbox = (w, h, d, r, mat) => new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 8, r), mat);
const extrude = (shape, depth, bevel, mat) => {
  const g = new THREE.ExtrudeGeometry(shape, {depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel,
    bevelSegments: 10, curveSegments: 48});
  g.center(); return new THREE.Mesh(g, mat);
};
const poly = pts => { const s = new THREE.Shape(); pts.forEach(([x, y], i) => i ? s.lineTo(x, y) : s.moveTo(x, y)); s.closePath(); return s; };
const checkShape = k => poly([[-.5, .02], [-.33, .19], [-.12, -.02], [.36, .48], [.53, .31], [-.12, -.36]].map(([x, y]) => [x * k, y * k]));
const at = (m, x = 0, y = 0, z = 0) => { m.position.set(x, y, z); return m; };

// ---------- Objets ----------
const O = {
  coin() {
    const one = (front) => {
      const g = new THREE.Group();
      const pts = [[0, -.13], [.93, -.13], [1, -.07], [1, .07], [.93, .13], [.84, .13], [.8, .09], [0, .09]].map(([x, y]) => new THREE.Vector2(x, y));
      const body = new THREE.Mesh(new THREE.LatheGeometry(pts, 128), metal(C.gold, .26)); body.rotation.x = Math.PI / 2; g.add(body);
      if (front) g.add(at(text('€', 1.0, .07, metal(0xF0A512, .3)), 0, 0, .14));
      return g;
    };
    const g = new THREE.Group();
    const back = one(false); back.position.set(.55, -.35, -.6); back.rotation.set(-1.0, .3, .2); g.add(back);
    const f = one(true); f.rotation.set(-.2, .5, .12); g.add(f);
    return g;
  },
  calendar() {
    const g = new THREE.Group();
    g.add(rbox(2, 2.1, .5, .24, clay(C.white, {r: .45, cc: .4})));
    g.add(at(rbox(2.02, .72, .56, .24, clay(C.blue, {r: .28, cc: 1})), 0, .72, 0));
    for (const x of [-.55, .55]) g.add(at(new THREE.Mesh(new THREE.CapsuleGeometry(.1, .38, 8, 24), metal(C.silver, .2)), x, 1.12, 0));
    g.add(at(text('31', .95, .16, clay(C.blueD, {r: .25, cc: 1})), 0, -.28, .3));
    g.rotation.set(.14, -.5, .06); return g;
  },
  shield() {
    const s = new THREE.Shape(); s.moveTo(0, 1.15);
    s.bezierCurveTo(.45, .95, .8, .95, 1.0, .95); s.lineTo(1.0, .2); s.bezierCurveTo(1.0, -.55, .5, -1.0, 0, -1.22);
    s.bezierCurveTo(-.5, -1.0, -1.0, -.55, -1.0, .2); s.lineTo(-1.0, .95); s.bezierCurveTo(-.8, .95, -.45, .95, 0, 1.15);
    const g = new THREE.Group();
    g.add(extrude(s, .3, .14, clay(C.blue, {r: .25, cc: 1})));
    g.add(at(extrude(checkShape(1.05), .1, .06, clay(C.white, {r: .3})), 0, -.02, .36));
    g.rotation.set(.12, -.5, .1); return g;
  },
  lock() {
    const g = new THREE.Group();
    g.add(at(rbox(1.7, 1.4, .7, .24, clay(C.orange, {r: .3, cc: 1})), 0, -.4, 0));
    g.add(at(new THREE.Mesh(new THREE.TorusGeometry(.52, .15, 32, 96, Math.PI), metal(C.silver, .18)), 0, .55, 0));
    for (const x of [-.52, .52]) g.add(at(new THREE.Mesh(new THREE.CylinderGeometry(.15, .15, .5, 32), metal(C.silver, .18)), x, .3, 0));
    const hole = new THREE.Mesh(new THREE.CylinderGeometry(.16, .16, .1, 48), clay(0x5A1A04, {r: .6, cc: 0})); hole.rotation.x = Math.PI / 2;
    g.add(at(hole, 0, -.3, .35)); g.add(at(rbox(.12, .36, .1, .05, clay(0x5A1A04, {r: .6, cc: 0})), 0, -.5, .35));
    g.rotation.set(.12, -.5, .08); return g;
  },
  pin() {
    const R = .8, pts = [new THREE.Vector2(0, -1.45), new THREE.Vector2(.12, -1.2), new THREE.Vector2(.3, -.8)];
    for (let a = -45; a <= 90; a += 5) { const r = a * Math.PI / 180; pts.push(new THREE.Vector2(R * Math.cos(r), .4 + R * Math.sin(r))); }
    pts[pts.length - 1].x = 0;
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 96), clay(C.orange, {r: .3, cc: 1})));
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(.33, .33, .3, 64), clay(C.white, {r: .35})); disc.rotation.x = Math.PI / 2;
    g.add(at(disc, 0, .4, .66));
    g.rotation.set(.12, .15, -.1); return g;
  },
  plus() {
    const w = .3, l = .82, g = new THREE.Group();
    g.add(extrude(poly([[-w, l], [w, l], [w, w], [l, w], [l, -w], [w, -w], [w, -l], [-w, -l], [-w, -w], [-l, -w], [-l, w], [-w, w]]), .35, .14, clay(C.orange, {r: .3, cc: 1})));
    g.rotation.set(.35, -.55, .25); return g;
  },
  document() {
    const g = new THREE.Group();
    g.add(rbox(1.6, 2.1, .12, .06, clay(C.white, {r: .5, cc: .3})));
    g.add(at(rbox(.9, .16, .06, .03, clay(C.blue, {r: .3})), -.25, .72, .08));
    [.38, .14, -.1, -.34].forEach((y, i) => g.add(at(rbox(i % 2 ? .9 : 1.15, .09, .05, .025, clay(C.line, {r: .5, cc: .2})), i % 2 ? -.25 : -.12, y, .08)));
    const badge = new THREE.Mesh(new THREE.CylinderGeometry(.45, .45, .2, 64), clay(C.green, {r: .28, cc: 1})); badge.rotation.x = Math.PI / 2;
    g.add(at(badge, .6, -.85, .22));
    g.add(at(extrude(checkShape(.5), .06, .03, clay(C.white)), .6, -.85, .36));
    g.rotation.set(.12, -.45, .1); return g;
  },
  briefcase() {
    const g = new THREE.Group();
    g.add(rbox(2.3, 1.55, .75, .24, clay(C.blueD, {r: .3, cc: 1})));
    g.add(at(new THREE.Mesh(new THREE.TorusGeometry(.38, .1, 24, 64, Math.PI), clay(C.ink, {r: .4})), 0, .78, 0));
    g.add(at(rbox(.46, .26, .14, .06, metal(C.gold, .25)), 0, .18, .4));
    g.rotation.set(.14, -.5, .06); return g;
  },
  bell() {
    const pts = [[0, .95], [.18, .93], [.38, .82], [.52, .6], [.58, .25], [.62, -.15], [.74, -.38], [.9, -.5], [.9, -.58], [0, -.58]].map(([x, y]) => new THREE.Vector2(x, y));
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.LatheGeometry(pts, 96), clay(0xFFB020, {r: .28, cc: 1})));
    g.add(at(new THREE.Mesh(new THREE.SphereGeometry(.2, 48, 32), clay(C.orange, {r: .3, cc: 1})), 0, -.72, 0));
    g.add(at(new THREE.Mesh(new THREE.TorusGeometry(.13, .05, 16, 48), clay(0xFFB020, {r: .3})), 0, 1.04, 0));
    g.rotation.set(.05, 0, .28); return g;
  },
  magnifier() {
    const g = new THREE.Group();
    g.add(new THREE.Mesh(new THREE.TorusGeometry(.72, .15, 40, 128), clay(C.blue, {r: .28, cc: 1})));
    const glass = new THREE.Mesh(new THREE.CylinderGeometry(.7, .7, .06, 96),
      new THREE.MeshPhysicalMaterial({color: 0xdff0ff, transmission: .9, roughness: .05, thickness: .3, ior: 1.4, transparent: true, opacity: .55}));
    glass.rotation.x = Math.PI / 2; g.add(glass);
    const handle = new THREE.Mesh(new THREE.CapsuleGeometry(.17, .95, 8, 32), clay(C.orange, {r: .3, cc: 1}));
    handle.position.set(.98, -.98, 0); handle.rotation.z = Math.PI / 4; g.add(handle);
    g.rotation.set(.15, -.45, 0); return g;
  },
};

const obj = O[name]();
scene.add(obj);
// Cadrage automatique : l'objet occupe ~84 % de l'image
const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3());
obj.position.sub(c);
const r = box.getBoundingSphere(new THREE.Sphere()).radius;
cam.position.set(0, 0, r / Math.sin(THREE.MathUtils.degToRad(cam.fov / 2)) * 1.0); cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
window.__done = true;
</script>
</body>
</html>
