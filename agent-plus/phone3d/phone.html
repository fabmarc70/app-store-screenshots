<!doctype html>
<html>
<!-- Téléphone 3D haute qualité (three.js) avec la capture plaquée sur l'écran.
     URL: /phone3d/phone.html?img=planning&ry=-22&rx=8&rz=5&color=natural -->
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const q = new URLSearchParams(location.search);
const IMG = q.get('img') || 'planning';
const deg = k => (+q.get(k) || 0) * Math.PI / 180;
const CW = +q.get('w') || 2400, CH = +q.get('h') || 3800;
const TITANE = {natural: [0xC4BFB5, 0xD9D5CD], black: [0x3A3C42, 0x2A2B30], blue: [0x41506B, 0x34405A], white: [0xE6E6E8, 0xF0F0F2]};
const [frameColor, backColor] = TITANE[q.get('color') || 'natural'];

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(CW, CH); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.02).texture;
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(-8, 10, 12); scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd6ff, 1.2); rim.position.set(10, 4, -6); scene.add(rim);

// ---- Dimensions (unités ≈ mm/10), écran au format exact des captures 1320×2868 ----
const SW = 7.16, SH = SW * 2868 / 1320, RS = SW * 165 / 1320;    // écran + rayon d'angle iPhone
const BEZEL = 0.24, RIM = 0.12;                                   // bordure noire + liseré métal vu de face
const GW = SW + 2 * BEZEL, GH = SH + 2 * BEZEL, RG = RS + BEZEL;  // vitre
const W = GW + 2 * RIM, H = GH + 2 * RIM, RB = RG + RIM, D = 0.83; // boîtier

const rr = (w, h, r) => { const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.absarc(x + w - r, y + r, r, -Math.PI / 2, 0);
  s.lineTo(x + w, y + h - r); s.absarc(x + w - r, y + h - r, r, 0, Math.PI / 2);
  s.lineTo(x + r, y + h); s.absarc(x + r, y + h - r, r, Math.PI / 2, Math.PI);
  s.lineTo(x, y + r); s.absarc(x + r, y + r, r, Math.PI, 1.5 * Math.PI); return s; };
const flat = (w, h, r) => { const g = new THREE.ShapeGeometry(rr(w, h, r), 64), p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + w / 2) / w, (p.getY(i) + h / 2) / h); return g; };

const phone = new THREE.Group();
const put = (mesh, x, y, z) => { mesh.position.set(x, y, z); phone.add(mesh); return mesh; };
// Boîtier : cadre titane aux flancs arrondis
const BT = 0.26, BS = 0.1;
const body = new THREE.ExtrudeGeometry(rr(W - 2 * BS, H - 2 * BS, RB - BS),
  {depth: D - 2 * BT, bevelEnabled: true, bevelThickness: BT, bevelSize: BS, bevelSegments: 16, curveSegments: 96});
body.center();
const titanium = new THREE.MeshPhysicalMaterial({color: frameColor, metalness: 1, roughness: .28, envMapIntensity: 1.25});
const backGlass = new THREE.MeshPhysicalMaterial({color: backColor, metalness: .2, roughness: .55});
phone.add(new THREE.Mesh(body, [backGlass, titanium]));
const zf = D / 2;
// Vitre avant noire brillante
put(new THREE.Mesh(flat(GW, GH, RG), new THREE.MeshPhysicalMaterial({color: 0x050507, roughness: .08, clearcoat: 1})), 0, 0, zf + .002);
// Écran : capture en couleurs exactes (non affectée par l'éclairage)
const tex = await new THREE.TextureLoader().loadAsync(`/clean/${IMG}.png`);
tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
put(new THREE.Mesh(flat(SW, SH, RS), new THREE.MeshBasicMaterial({map: tex, toneMapped: false})), 0, 0, zf + .004);
// Dynamic Island (125×37 pt, à 11 pt du haut)
const px = SW / 1320, IW = 375 * px, IH = 111 * px;
put(new THREE.Mesh(flat(IW, IH, IH / 2), new THREE.MeshBasicMaterial({color: 0x000000})), 0, SH / 2 - 33 * px - IH / 2, zf + .006);
// Reflet discret sur la vitre
const gc = document.createElement('canvas'); gc.width = 256; gc.height = 512; const gx = gc.getContext('2d');
const gr = gx.createLinearGradient(0, 0, 256, 512); gr.addColorStop(0, 'rgba(255,255,255,.13)'); gr.addColorStop(.38, 'rgba(255,255,255,.03)'); gr.addColorStop(.5, 'rgba(255,255,255,0)');
gx.fillStyle = gr; gx.fillRect(0, 0, 256, 512);
const glare = new THREE.CanvasTexture(gc); glare.colorSpace = THREE.SRGBColorSpace;
put(new THREE.Mesh(flat(GW, GH, RG), new THREE.MeshBasicMaterial({map: glare, transparent: true, depthWrite: false, toneMapped: false})), 0, 0, zf + .008);
// Boutons latéraux (bouton Action, volume +/−, bouton latéral)
const btn = (side, fromTop, len) => { const m = new THREE.Mesh(new RoundedBoxGeometry(.16, len, .34, 6, .07), titanium);
  m.position.set(side * (W / 2 + .03), H / 2 - fromTop - len / 2, 0); phone.add(m); };
btn(-1, 2.55, .85); btn(-1, 4.0, 1.45); btn(-1, 5.75, 1.45); btn(1, 4.5, 2.3);

phone.rotation.set(deg('rx'), deg('ry'), deg('rz'));
scene.add(phone);
const cam = new THREE.PerspectiveCamera(18, CW / CH, 1, 200);
cam.position.set(0, 0, 62); cam.lookAt(0, 0, 0);
renderer.render(scene, cam);
window.__done = true;
</script>
</body>
</html>
